name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gsci
          POSTGRES_PASSWORD: gsci
          POSTGRES_DB: gsci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://gsci:gsci@localhost:5432/gsci
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://gsci:gsci@localhost:5432/gsci
        run: pytest -v -m "not slow"

      - name: Dependency vulnerability scan (informatif, cf. ADR-014)
        run: pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gsci-api:ci ./backend

      - name: Build frontend image
        run: docker build -t gsci-frontend:ci ./frontend
