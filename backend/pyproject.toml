[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 : Depends() dans les valeurs par défaut est le pattern standard FastAPI, pas un bug.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
