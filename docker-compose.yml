version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gsci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsci}
      POSTGRES_DB: ${POSTGRES_DB:-gsci}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gsci}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gsci-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gsci-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gsci}:${POSTGRES_PASSWORD:-gsci}@postgres:5432/${POSTGRES_DB:-gsci}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - gsci-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gsci-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gsci-network

volumes:
  postgres_data:

networks:
  gsci-network:
    driver: bridge
